<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#D97757" />
  <meta name="description" content="Administrador cálido de actividades y recordatorios personales con soporte offline." />
  <title>Aura | Mis Actividades</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <div>
        <h1>Aura</h1>
        <p class="subtitle">Tu espacio tranquilo para organizar el día</p>
      </div>
      <div class="header-actions">
        <span id="connection-badge" class="badge badge-online" aria-live="polite">En línea</span>
        <button id="btn-notify-perm" class="btn btn-soft" type="button" title="Activar recordatorios">
          🔔 Activar avisos
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Banner de sincronización pendiente -->
    <div id="sync-banner" class="sync-banner hidden" role="status">
      <span>Tienes cambios guardados localmente esperando conexión para sincronizarse.</span>
      <button id="btn-force-sync" class="btn btn-small" type="button">Sincronizar ahora</button>
    </div>

    <!-- Formulario CRUD (Crear / Editar) -->
    <section class="card form-card" aria-labelledby="form-title">
      <h2 id="form-title">Nueva actividad</h2>
      <form id="activity-form">
        <input type="hidden" id="activity-id" />
        
        <div class="form-group">
          <label for="title">¿Qué tienes planeado?</label>
          <input type="text" id="title" placeholder="Ej. Leer 20 páginas, llamar a mamá..." required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="datetime">Fecha y hora del recordatorio</label>
            <input type="datetime-local" id="datetime" required />
          </div>

          <div class="form-group">
            <label for="category">Categoría</label>
            <select id="category">
              <option value="Personal">🌿 Personal</option>
              <option value="Estudio">📚 Estudio</option>
              <option value="Trabajo">💼 Trabajo</option>
              <option value="Salud">☀️ Bienestar</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Notas adicionales (opcional)</label>
          <textarea id="notes" rows="2" placeholder="Detalles pequeños para no olvidar..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn btn-primary">Guardar actividad</button>
          <button type="button" id="btn-cancel-edit" class="btn btn-ghost hidden">Cancelar edición</button>
        </div>
      </form>
    </section>

    <!-- Lista de actividades -->
    <section class="activities-section" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">Tus recordatorios</h2>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="pending">Pendientes</button>
          <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>
      </div>

      <div id="activities-list" class="activities-grid">
        <!-- Las tarjetas se renderizan dinámicamente desde IndexedDB -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
